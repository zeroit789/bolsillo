<!doctype html>
<!-- ES: Página única que carga la app Vue (Tauri la muestra en su ventana).
     EN: Single page that loads the Vue app (Tauri shows it in its window). -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ES: Fuentes de la app: Syne (titulares) + DM Sans (cuerpo)
         EN: App fonts: Syne (headings) + DM Sans (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap"
      rel="stylesheet"
    />
    <title>Bolsillo — Gestor de gastos personales</title>
  </head>

  <body>
    <!-- ES: Punto de montaje de Vue; main.ts arranca la app aquí.
         EN: Vue mount point; main.ts boots the app here. -->
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
