# ES: Config de pnpm. allowBuilds: qué paquetes pueden ejecutar scripts de
#     instalación (pnpm los bloquea por defecto por seguridad).
#      - esbuild: lo necesita Vite para transpilar.
#      - core-js: false -> no ejecuta su postinstall (solo muestra un aviso), no hace falta.
# EN: pnpm config. allowBuilds: which packages may run install scripts (pnpm
#     blocks them by default for security).
#      - esbuild: Vite needs it to transpile.
#      - core-js: false -> its postinstall (just a notice) is skipped; not needed.
allowBuilds:
  esbuild: true
  core-js: false

# ES: overrides: fuerza versiones de dependencias indirectas con avisos de seguridad.
#      - uuid: exceljs 4.4.0 (sin versión nueva) fija uuid ^8.3.0, afectado por un
#        aviso; se fuerza la 11.x (11.1.1 trae el arreglo y mantiene el build CommonJS
#        que usa exceljs). Quitarlo cuando exceljs publique una versión que lo suba.
# EN: overrides: force versions of indirect dependencies with security advisories.
#      - uuid: exceljs 4.4.0 (no newer release) pins uuid ^8.3.0, which has an
#        advisory; force 11.x (11.1.1 has the fix and keeps the CommonJS build that
#        exceljs uses). Remove it once exceljs ships a release that bumps it.
overrides:
  uuid: ^11.1.1
