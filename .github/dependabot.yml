# ES: Configuración de Dependabot. Cada lunes revisa si hay versiones nuevas y
#     abre PR agrupadas por ecosistema: una con los cambios menores y parches, y
#     otra con las versiones mayores (que suelen romper y conviene probar aparte).
# EN: Dependabot configuration. Every Monday it checks for new versions and
#     opens grouped PRs per ecosystem: one with minor and patch updates, and
#     another with major versions (they tend to break and are tested separately).
version: 2
updates:
  # ES: Dependencias de npm del frontend (Vue + Vite) / EN: frontend npm dependencies (Vue + Vite)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      npm-menores:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-mayores:
        patterns: ["*"]
        update-types: [major]
    # ES: TypeScript 7 aún no vale: vue-tsc depende de la API de JS que la 7 ya no trae y typescript-eslint
    #     pide < 6.1 (comprobado el 23-11-2026). Quitar este ignore cuando los dos la soporten.
    # EN: TypeScript 7 doesn't work yet: vue-tsc relies on the JS API that 7 no longer ships and typescript-eslint
    #     requires < 6.1 (checked on 2026-11-23). Remove this ignore once both support it.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # ES: Crates de Rust del backend Tauri / EN: Rust crates of the Tauri backend
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      cargo-menores:
        patterns: ["*"]
        update-types: [minor, patch]
      cargo-mayores:
        patterns: ["*"]
        update-types: [major]

  # ES: Acciones de GitHub usadas en la CI / EN: GitHub Actions used by CI
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Madrid
    groups:
      actions:
        patterns: ["*"]
